<svg width="260" height="300" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="photoClip">
      <rect x="20" y="20" width="220" height="220" rx="6"/>
    </clipPath>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F8BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4F8BFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F8BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="260" height="300" fill="#050816"/>

  <image href="https://avatars.githubusercontent.com/u/191918881?s=400&u=d0ae202935b44b2c34d5aa9ccf9eb977e28517fc&v=4" x="20" y="20" width="220" height="220"
         clip-path="url(#photoClip)" preserveAspectRatio="xMidYMid slice"/>

  <rect x="20" y="20" width="220" height="220" rx="6" fill="none" stroke="#4F8BFF" stroke-opacity="0.45" stroke-width="1"/>

  <g filter="url(#glow)">
    <rect x="20" width="220" height="12" fill="url(#scanGrad)">
      <animate attributeName="y" values="20;230;20" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g stroke="#4F8BFF" stroke-width="2.5" fill="none">
    <path d="M20 38 V20 H38"/>
    <path d="M222 20 H240 V38"/>
    <path d="M240 222 V240 H222"/>
    <path d="M38 240 H20 V222"/>
  </g>

  <circle cx="228" cy="30" r="4" fill="#4F8BFF">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <text x="130" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#4F8BFF">
    IDENTITY VERIFIED
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="130" y="288" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b95ab">
    tarek.najem — engineer.exe
  </text>
</svg>
